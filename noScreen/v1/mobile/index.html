<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07131d">
  <title>డాక్టర్ మొబైల్ కన్సోల్ | CareCall V1</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif;
      color: #eaf3fb;
      background: radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.16), transparent 40%),
                  linear-gradient(165deg, #07131d 0%, #0b1926 55%, #07111a 100%);
      -webkit-user-select: none;
      user-select: none;
    }
    .mobile-app {
      width: min(100%, 480px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mobile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      margin: 0 0 2px;
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand span { color: #34d399; }
    .mobile-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .desktop-link {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.82);
      text-decoration: none;
      font-size: 1.15rem;
      transition: transform 0.15s;
    }
    .desktop-link:active { transform: scale(0.95); }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .status-pill {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 4px 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: 0.74rem;
      font-weight: 700;
      text-align: center;
    }
    .status-pill i {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-pill.connected { color: #86efac; border-color: rgba(52, 211, 153, 0.4); }
    .status-pill.connected i { background: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); }
    .status-pill.offline { color: #fda4af; border-color: rgba(244, 63, 94, 0.4); }
    .status-pill.offline i { background: #fb7185; }

    /* Live TV Active Card */
    .active-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .active-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .active-elapsed {
      font-size: 0.74rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .active-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .active-token-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .active-num {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 14px rgba(56, 189, 248, 0.4);
    }
    .active-words {
      font-size: 1.05rem;
      font-weight: 800;
      color: #60a5fa;
    }
    .active-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-recall {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.25), rgba(3, 105, 161, 0.35));
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-recall:active:not(:disabled) {
      transform: scale(0.95);
      background: #0284c7;
      color: #fff;
    }
    .btn-recall:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Keypad Card */
    .call-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    .selected-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .selected-label {
      color: #94a3b8;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-quick-next {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      color: #7dd3fc;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-quick-next:active { background: rgba(56, 189, 248, 0.3); }

    .selected-number {
      min-height: clamp(52px, 9vh, 72px);
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: clamp(2.6rem, 13vw, 4.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      border-bottom: 2px solid rgba(56, 189, 248, 0.25);
      text-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 0;
    }
    .keypad button {
      aspect-ratio: 1.55 / 1;
      min-height: 50px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
      color: #ffffff;
      font-size: clamp(1.3rem, 6vw, 1.7rem);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s, background 0.1s;
    }
    .keypad button:active {
      transform: scale(0.94);
      background: #0284c7;
      border-color: #38bdf8;
    }
    .keypad .key-clear { color: #f59e0b; }
    .keypad .key-back { color: #38bdf8; }

    .send-button {
      width: 100%;
      min-height: 52px;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      color: white;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.2s;
    }
    .send-button:active:not(:disabled) { transform: scale(0.98); }
    .send-button b { font-size: 1.3rem; }
    .send-button:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }

    .feedback {
      min-height: 18px;
      margin: 6px 4px 0;
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
    }

    .mobile-nav {
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.9);
    }
    .mobile-nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      transition: color 0.15s;
    }
    .mobile-nav a:hover, .mobile-nav a:active { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="mobile-app">
    <header class="mobile-header">
      <div>
        <p class="brand">Care<span>Call V1</span></p>
        <h1>డాక్టర్ మొబైల్</h1>
      </div>
      <a class="desktop-link" href="/desktop/" aria-label="డెస్క్‌టాప్ పోర్టల్" title="డెస్క్‌టాప్ వెర్షన్">🖥️</a>
    </header>

    <section class="status-row">
      <span class="status-pill" id="serverStatus"><i></i>కనెక్ట్ అవుతోంది…</span>
      <span class="status-pill" id="screenStatus"><i></i>స్క్రీన్స్: 0</span>
    </section>

    <!-- Prominent Live TV Active Token Mirror -->
    <section class="active-card" id="activeCard">
      <div class="active-header">
        <span class="active-badge"><i class="live-dot"></i>లైవ్ టీవీ స్క్రీన్ · NOW SERVING</span>
        <span class="active-elapsed" id="activeElapsed">వేచి ఉంది…</span>
      </div>
      <div class="active-body">
        <div class="active-token-group">
          <span class="active-num" id="activeNum">--</span>
          <span class="active-words" id="activeWords">కాల్ కోసం వేచి ఉంది</span>
        </div>
        <div class="active-actions">
          <button type="button" class="btn-recall" id="btnRecall" title="మళ్లీ టీవీలో బెల్ మోగించండి" disabled>
            <span>🔔 మళ్లీ పిలవండి</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Keypad to Dial Next Token -->
    <section class="call-card">
      <div class="selected-bar">
        <span class="selected-label">తదుపరి నంబర్ · NEXT TOKEN</span>
        <button type="button" class="btn-quick-next" id="btnQuickNext" title="తదుపరి టోకెన్ సెట్ చేయండి">+1 తదుపరి</button>
      </div>
      <output class="selected-number" id="selectedNumber">—</output>

      <div class="keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="key-clear" id="keyClear">C</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="key-back" id="keyBack">⌫</button>
      </div>

      <button class="send-button" id="sendCall" type="button" disabled>
        <span>డిస్‌ప్లేకి పంపండి</span><b aria-hidden="true">→</b>
      </button>
      <div class="feedback" id="feedback"></div>
    </section>

    <nav class="mobile-nav">
      <a href="/mobile/">📱 <span>మొబైల్</span></a>
      <a href="/tv/">📺 <span>టీవీ</span></a>
      <a href="/desktop/">🖥️ <span>డెస్క్‌టాప్</span></a>
    </nav>
  </main>

  <script>
  (function () {
    "use strict";

    var selectedNumber = document.getElementById("selectedNumber");
    var sendButton = document.getElementById("sendCall");
    var feedback = document.getElementById("feedback");
    var serverStatus = document.getElementById("serverStatus");
    var screenStatus = document.getElementById("screenStatus");
    var keyClear = document.getElementById("keyClear");
    var keyBack = document.getElementById("keyBack");
    var btnQuickNext = document.getElementById("btnQuickNext");
    var btnRecall = document.getElementById("btnRecall");

    var activeNum = document.getElementById("activeNum");
    var activeWords = document.getElementById("activeWords");
    var activeElapsed = document.getElementById("activeElapsed");

    var currentDigits = "";
    var socket = null;
    var retryTimer = null;
    var isConnected = false;
    var activeCall = null;

    var TELUGU_UNITS = [
      "సున్నా", "ఒకటి", "రెండు", "మూడు", "నాలుగు", "ఐదు",
      "ఆరు", "ఏడు", "ఎనిమిది", "తొమ్మిది", "పది",
      "పదకొండు", "పన్నెండు", "పదమూడు", "పద్నాలుగు", "పదిహేను",
      "పదహారు", "పదిహేడు", "పద్దెనిమిది", "పంతొమ్మిది"
    ];

    var TELUGU_TENS = [
      "", "", "ఇరవై", "ముప్పై", "నలభై", "యాభై",
      "అరవై", "డెబ్బై", "ఎనభై", "తొంభై"
    ];

    function numberToTeluguWords(num) {
      var n = Math.floor(Number(num));
      if (!isFinite(n) || n < 0 || n > 999) return String(num);
      if (n < 20) return TELUGU_UNITS[n];
      if (n < 100) {
        var tens = Math.floor(n / 10);
        var rem = n % 10;
        return rem === 0 ? TELUGU_TENS[tens] : (TELUGU_TENS[tens] + " " + TELUGU_UNITS[rem]);
      }
      var hundreds = Math.floor(n / 100);
      var rem100 = n % 100;
      var hundredText = hundreds === 1 ? "వంద" : (TELUGU_UNITS[hundreds] + " వందల");
      if (rem100 === 0) return hundredText;
      return hundredText + " " + numberToTeluguWords(rem100);
    }

    function setPill(pill, text, isOk) {
      if (!pill) return;
      pill.classList.remove("connected", "offline");
      pill.classList.add(isOk ? "connected" : "offline");
      var textNode = pill.lastChild;
      if (textNode) textNode.textContent = text;
    }

    function formatElapsed(sentAt) {
      if (!sentAt) return "వేచి ఉంది…";
      var sec = Math.max(0, Math.floor((Date.now() - sentAt) / 1000));
      if (sec < 60) return sec + "సె క్రితం";
      var mins = Math.floor(sec / 60);
      var rem = sec % 60;
      return mins + "ని " + (rem > 0 ? rem + "సె " : "") + "క్రితం";
    }

    function renderActive() {
      if (!activeCall || !activeCall.number) {
        activeNum.textContent = "--";
        activeWords.textContent = "కాల్ కోసం వేచి ఉంది";
        activeElapsed.textContent = "వేచి ఉంది…";
        btnRecall.disabled = true;
        return;
      }
      activeNum.textContent = activeCall.number;
      var n = Number(activeCall.number);
      activeWords.textContent = (isFinite(n) && n >= 0) ? numberToTeluguWords(n) : "";
      activeElapsed.textContent = formatElapsed(activeCall.sentAt);
      btnRecall.disabled = !isConnected;
    }

    function updateView() {
      selectedNumber.textContent = currentDigits || "—";
      sendButton.disabled = (!currentDigits || !isConnected);
    }

    function connect() {
      if (socket) {
        try { socket.close(); } catch (e) {}
        socket = null;
      }

      setPill(serverStatus, "కనెక్ట్ అవుతోంది…", false);
      var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      var url = protocol + "//" + window.location.host + "/ws";

      try {
        socket = new window.WebSocket(url);
      } catch (err) {
        setPill(serverStatus, "కనెక్షన్ సమస్య", false);
        scheduleRetry();
        return;
      }

      socket.onopen = function () {
        isConnected = true;
        setPill(serverStatus, "సర్వర్ కనెక్ట్ అయింది", true);
        updateView();
        renderActive();
      };

      socket.onclose = function () {
        isConnected = false;
        socket = null;
        setPill(serverStatus, "డిస్‌కనెక్ట్ అయింది", false);
        updateView();
        renderActive();
        scheduleRetry();
      };

      socket.onerror = function () {
        setPill(serverStatus, "కనెక్షన్ సమస్య", false);
      };

      socket.onmessage = function (event) {
        var data;
        try { data = JSON.parse(event.data); } catch (e) { return; }

        if (data.onlineCount !== undefined) {
          setPill(screenStatus, "కనెక్టెడ్: " + data.onlineCount, data.onlineCount > 1);
        }

        if (data.type === "state" && data.announcement && data.announcement.number) {
          activeCall = data.announcement;
          renderActive();
          if (data.cause === "call") {
            feedback.textContent = "టోకెన్ " + activeCall.number + " టీవీకి పంపబడింది!";
          }
        }
      };
    }

    function scheduleRetry() {
      if (retryTimer) return;
      retryTimer = window.setTimeout(function () {
        retryTimer = null;
        connect();
      }, 2000);
    }

    // Keypad handlers
    document.querySelectorAll("[data-digit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (currentDigits.length < 3) {
          currentDigits += btn.getAttribute("data-digit");
          updateView();
        }
      });
    });

    keyClear.addEventListener("click", function () {
      currentDigits = "";
      updateView();
    });

    keyBack.addEventListener("click", function () {
      currentDigits = currentDigits.slice(0, -1);
      updateView();
    });

    // Send button: Dispatch to TV
    sendButton.addEventListener("click", function () {
      if (!currentDigits || !socket || socket.readyState !== 1) return;
      var num = currentDigits;
      socket.send(JSON.stringify({ type: "call", number: num }));
      feedback.textContent = "టోకెన్ " + num + " డిస్‌ప్లేకి పంపబడింది!";
      currentDigits = "";
      updateView();
    });

    // Recall button: Ring bell / announce active token again
    btnRecall.addEventListener("click", function () {
      if (!activeCall || !activeCall.number || !socket || socket.readyState !== 1) return;
      socket.send(JSON.stringify({ type: "call", number: activeCall.number }));
      feedback.textContent = "టోకెన్ " + activeCall.number + " మళ్లీ పిలవబడింది!";
    });

    // Quick +1 Next button: Increment active token
    btnQuickNext.addEventListener("click", function () {
      var next = 1;
      if (activeCall && !isNaN(Number(activeCall.number))) {
        next = Number(activeCall.number) + 1;
      }
      currentDigits = String(next);
      updateView();
    });

    // 1-second interval to update elapsed call time
    setInterval(function () {
      if (activeCall && activeCall.sentAt) {
        activeElapsed.textContent = formatElapsed(activeCall.sentAt);
      }
    }, 1000);

    connect();
  })();
  </script>
</body>
</html>
